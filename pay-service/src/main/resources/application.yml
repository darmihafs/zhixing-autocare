# =====================================================================
# 支付服务 pay-service：模拟支付、回调幂等、WebSocket 推送
# 端口 8085；库 hc_pay；Redis db5；RocketMQ 生产+消费
# =====================================================================
server:
  port: 8085
  address: ${SERVER_ADDRESS:127.0.0.1}

# Sentinel 的 Feign 适配由 spring-cloud-starter-alibaba-sentinel 提供，
# 其 @ConditionalOnProperty 只认 feign.sentinel.enabled（无 spring.cloud 前缀），
# 放在 spring.cloud.openfeign 下不会生效，FallbackFactory 不会被织入。
feign:
  sentinel:
    enabled: true

spring:
  application:
    name: pay-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/hc_pay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USERNAME:root}
    password: "${MYSQL_PASSWORD:123456}"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: "${REDIS_PASSWORD:123456}"
      database: 5
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: ${spring.application.name}-producer-group
    send-message-timeout: 3000

hc:
  # 服务间内部凭证（/internal/** 校验；网关不路由该前缀）
  internal:
    token: ${INTERNAL_TOKEN:hc-internal-2026-dev-token}
  # 演示模拟支付开关：本地演示开启，生产设 HC_DEMO_ENABLED=false 一键关闭
  demo:
    enabled: ${HC_DEMO_ENABLED:true}
  ws:
    allowed-origins: "${HC_WS_ALLOWED_ORIGINS:*}"
  # 与 gateway/user-service 同一 JWT 密钥：WebSocket 握手从 ?token= 验签取 userId
  jwt:
    secret: ${JWT_SECRET:hongcheng-car-platform-jwt-secret-2026-dev-only}
    expire-ms: 7200000
  sentinel:
    # 创建支付单入口 QPS 阈值（可启动参数覆盖做流控触发验证）
    pay-create-qps: 20
    pay-degrade-rt-ms: 1000
    pay-degrade-min-requests: 5
    pay-degrade-window-seconds: 10

logging:
  level:
    com.hongcheng: info