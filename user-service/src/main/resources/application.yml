# =====================================================================
# 用户服务 user-service：注册/登录、关注、点赞
# 端口 8081；库 hc_user；Redis db1
# =====================================================================
server:
  port: 8081
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/hc_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USERNAME:root}
    password: "${MYSQL_PASSWORD:123456}"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: "${REDIS_PASSWORD:123456}"
      database: 1
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: ${spring.application.name}-producer-group
    send-message-timeout: 3000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# JWT：与 gateway 保持同一密钥
hc:
  jwt:
    secret: ${JWT_SECRET:hongcheng-car-platform-jwt-secret-2026-dev-only}
    expire-ms: 7200000
  # 内部调用凭证：与其他服务一致，仅 Feign 携带
  internal:
    token: ${INTERNAL_TOKEN:hc-internal-2026-dev-token}
  # 管理员模拟用户视角：短有效期（15 分钟），不签发 Refresh Token
  impersonation:
    expire-ms: 900000

logging:
  level:
    com.hongcheng: info