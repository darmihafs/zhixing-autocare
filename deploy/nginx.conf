# =====================================================================
# 洪兴洗车电商服务平台 - 生产 Nginx 反向代理参考配置
# 使用方式：放入 /etc/nginx/conf.d/hongcheng.conf，按实际域名与前端构建路径调整
# =====================================================================
server {
    listen 80;
    server_name _;

    # 如需开启 HTTPS，可配置 443 ssl 并由 Certbot/云证书托管，前端会自动将 ws:// 切换为 wss://
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 对齐 review-service spring.servlet.multipart.max-request-size=25MB
    client_max_body_size 25m;

    # 前端构建产物目录（cd frontend && npm run build 输出至 dist/）
    root /opt/hongcheng/frontend/dist;
    index index.html;

    # 静态资源长缓存
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 历史模式路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI 导购 SSE 流式对话专用配置（必须位于通用 /api/ 前，严禁缓冲/压缩）
    location = /api/ai/chat/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # WebSocket 专用反代（/ws/pay 与 /ws/order）；关闭访问日志避免 query 中 token 落盘
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        access_log off;
    }

    # 其余后端 API 与晒图上传静态资源（proxy_pass 末尾不加 /，保留 /api 前缀供网关 StripPrefix=1）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
