# =====================================================================
# RocketMQ 5.1.4 Broker 配置（开发环境单机）
# 挂载到容器 /home/rocketmq/conf/broker.conf
# =====================================================================
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 每天凌晨 4 点清理过期文件，保留 48 小时
deleteWhen = 04
fileReservedTime = 48

# 开发环境允许自动创建 Topic / 订阅组（生产环境应关闭）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

listenPort = 10911
namesrvAddr = rocketmq-namesrv:9876

# 关键：向 NameServer 注册宿主机可达地址。
# Java 应用跑在宿主机（Windows）上，通过 127.0.0.1:10911 端口映射访问 Broker；
# 若不设置，Broker 会注册容器内网 IP（172.x），宿主机生产者将连不上。
brokerIP1 = 127.0.0.1

# 存储路径（对应命名卷 hc-rocketmq-broker-store）
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog