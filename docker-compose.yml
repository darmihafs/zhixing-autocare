# =====================================================================
# 洪兴洗车电商服务平台 - 本地中间件环境（Docker Compose v2）
# 启动：在本文件所在目录执行  docker compose up -d
# 停止：docker compose down          （数据保留在命名卷中）
# 彻底重置：docker compose down -v   （会删除所有数据卷，慎用）
#
# 端口说明（重要）：
#   本机已有 MySQL 占用 3306、Redis 占用 6379，为避免冲突：
#   - 容器 MySQL  映射到宿主机 3307  ->  应用连接 127.0.0.1:3307
#   - 容器 Redis  映射到宿主机 6380  ->  应用连接 127.0.0.1:6380
#   其余端口：Nacos 8848/9848/9849、RocketMQ 9876/10909/10911/10912、ES 9200
#
# 账号：MySQL root/123456；Redis 密码 123456；Nacos 未开启鉴权（开发环境）
# =====================================================================
name: hongcheng-car

services:
  # ---------------- MySQL 8.0 ----------------
  mysql:
    image: mysql:8.0.36
    container_name: hc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-123456}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --lower-case-table-names=1
    ports:
      - "${BIND_HOST:-127.0.0.1}:3307:3306"
    volumes:
      # 首次启动（数据卷为空时）自动按文件名顺序执行初始化 SQL
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - hc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"${MYSQL_PASSWORD:-123456}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------- Redis 7 ----------------
  redis:
    image: redis:7.2.4
    container_name: hc-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:-123456}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:6380:6379"
    volumes:
      - hc-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------- Nacos 2.3.2（单机模式，注册中心 + 配置中心） ----------------
  # 与 SCA 2023.0.1.0 内置 nacos-client 2.3.2 版本一致
  # 单机模式使用内嵌 Derby 存储，配置数据持久化在命名卷中
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: hc-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "${NACOS_AUTH_ENABLE:-false}"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "${BIND_HOST:-127.0.0.1}:8848:8848"   # 控制台 / HTTP API
      - "${BIND_HOST:-127.0.0.1}:9848:9848"   # gRPC（客户端，2.x 必须映射）
      - "${BIND_HOST:-127.0.0.1}:9849:9849"   # gRPC（服务端间同步）
    volumes:
      - hc-nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------- RocketMQ 5.1.4 NameServer ----------------
  # 与 rocketmq-spring-boot-starter 2.3.0（客户端 5.1.4）版本一致
  # JAVA_OPT_EXT 追加在默认 JVM 参数之后，覆盖默认 4g/8g 堆，防止爆内存
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: hc-rocketmq-namesrv
    restart: unless-stopped
    # 镜像默认用户 rocketmq(uid 3000)，但命名卷首建时属主为 root，
    # 非 root 写不了 logs/store 会导致 broker 崩溃循环；开发环境以 root 运行
    user: root
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "${BIND_HOST:-127.0.0.1}:9876:9876"
    volumes:
      - hc-rocketmq-namesrv-logs:/home/rocketmq/logs

  # ---------------- RocketMQ 5.1.4 Broker ----------------
  # broker.conf 中 brokerIP1=127.0.0.1：保证宿主机上的 Java 进程
  # 拿到的是 127.0.0.1:10911（经端口映射可达），而不是容器内网 IP
  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: hc-rocketmq-broker
    restart: unless-stopped
    user: root   # 同 namesrv：命名卷属主 root 与镜像 uid 3000 冲突
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      # -XX:-UseContainerSupport：Docker Desktop(WSL2, cgroup v2) 下 JDK 探测容器
      # 指标会在 OperatingSystemMXBean 初始化时 NPE，导致 RocketMQ StoreUtil 类初始化
      # 失败、拉消息报 NoClassDefFoundError；关闭容器感知改用宿主机指标即可
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m -XX:-UseContainerSupport"
    ports:
      - "${BIND_HOST:-127.0.0.1}:10909:10909"  # VIP 通道
      - "${BIND_HOST:-127.0.0.1}:10911:10911"  # 主通信端口
      - "${BIND_HOST:-127.0.0.1}:10912:10912"  # HA 端口
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - hc-rocketmq-broker-store:/home/rocketmq/store
      - hc-rocketmq-broker-logs:/home/rocketmq/logs

  # ---------------- Elasticsearch 8.10.4 + IK 分词器 ----------------
  # 客户端版本由 Boot 3.2.4 BOM 锁定为 8.10.4，服务端与之一致
  # IK 插件在 Dockerfile 中安装（get.infini.cloud 官方源，版本已验证可下载）
  # JVM 堆按要求限制：-Xms256m -Xmx512m
  elasticsearch:
    build:
      context: ./docker/elasticsearch
    image: hc-elasticsearch:8.10.4-ik
    container_name: hc-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "${ES_SECURITY_ENABLED:-false}"
      ES_JAVA_OPTS: "-Xms256m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "${BIND_HOST:-127.0.0.1}:9200:9200"
    volumes:
      - hc-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  hc-mysql-data:
  hc-redis-data:
  hc-nacos-data:
  hc-rocketmq-namesrv-logs:
  hc-rocketmq-broker-store:
  hc-rocketmq-broker-logs:
  hc-es-data: